<title id="t">Cost of one dependent compute dispatch</title><desc id="d">Full CDM barrier 4.05-4.25 microseconds, light barrier 0x17f 3.11-3.19, wait bit only 1.84-2.09 (not adopted), no barrier 0.13 (incorrect results).</desc>
